        #lightbox-content-wrapper {

            justify-content: center;

        }

            max-height: 85vh;

            transform: scale(0.95); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            user-select: none;
            -webkit-user-drag: none; 
        }
        #lightbox-overlay.active #lightbox-img.loaded { transform: scale(1); opacity: 1; }

            z-index: 9999;

        .accordion-content {

            opacity: 0;
            overflow: hidden; 
        }
        .accordion-content.open { grid-template-rows: 1fr; opacity: 1; margin-top: 0.5rem; }
        .accordion-content > div { overflow: hidden; }
        
        /* Kategori 1.1: SSS (Sıkça Sorulan Sorular) Modülü Taşıntısı Çözümü (Columns yerine Grid/Masonry alternatifi) */
        .faq-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (min-width: 1024px) {
            .faq-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        /* Kategori 3.1: Sekmeli (Tab) Görünüm İçin Stiller */

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PROFESYONEL İYİLEŞTİRMELER — Mevcut yapıyı koruyarak */
        * { -webkit-tap-highlight-color: transparent; }

        /* Gelişmiş sayfa geçiş animasyonu */
        #app-content { transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .page-fade-out { opacity: 0; transform: translateY(12px) scale(0.998); }
        .page-fade-in { opacity: 1; transform: translateY(0) scale(1); }

        /* Gelişmiş reveal-element animasyonları (stagger/zincirleme) */
        .reveal-element {
            opacity: 0;
            transform: translateY(45px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal-visible { opacity: 1; transform: translateY(0); }
        .reveal-left { transform: translateX(-45px); }
        .reveal-right { transform: translateX(45px); }
        .reveal-left.reveal-visible, .reveal-right.reveal-visible { transform: translateX(0); }
        .reveal-scale { transform: scale(0.92); }
        .reveal-scale.reveal-visible { transform: scale(1); }

        .delay-100 { transition-delay: 80ms; }

        /* Gelişmiş buton efektleri — ripple benzeri */
        .btn-press { transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease; cursor: pointer; position: relative; overflow: hidden; }
        .btn-press:active { transform: scale(0.94); }
        .btn-press::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease, opacity 0.5s ease;
            opacity: 1; pointer-events: none;
        }
        .btn-press:active::after { width: 300px; height: 300px; opacity: 0; }

        /* Floating butonlar her zaman sabit pozisyonda kalır (btn-press position:relative override) */
        .floating-btn, .floating-btn.btn-press { position: fixed; }

        /* Gelişmiş CTA pulse */
        @keyframes pulse-soft {
            0%, 100% { box-shadow: 0 0 0 0 rgba(243, 156, 18, 0.45); transform: scale(1); }
            50% { box-shadow: 0 0 0 14px rgba(243, 156, 18, 0); transform: scale(1.015); }

        .cta-pulse { animation: pulse-soft 3.5s infinite cubic-bezier(0.66, 0, 0, 1); }

        /* Floating butonlar — sürekli hafif nefes alma */
        @keyframes float-breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }

        .btn-call, .btn-chat { animation: float-breathe 4s ease-in-out infinite; }
        .btn-scroll-top { animation: none; }
        .floating-btn:hover { animation: none; transform: scale(1.12) rotate(5deg); }

        /* Header geçişinde smooth blur (glassmorphism) */
        #main-header { transition: background-color 0.5s ease, backdrop-filter 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease; }

        /* Görsel hover'da zoom container */
        .img-zoom-container { overflow: hidden; }
        .img-zoom-container img { transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
        .img-zoom-container:hover img { transform: scale(1.06); }

        /* Modal / Lightbox gelişmiş geçişler */
        .modal-overlay { transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s; }
        .modal-overlay > div { transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease; }

        /* Toast mesajı gelişmiş */
        #toast-message {
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        /* Başlık altı çizgi animasyonu (hover'da büyüyen çizgi) */
        .title-underline { position: relative; }
        .title-underline::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            width: 0; height: 3px; background: #f39c12; border-radius: 2px;
            transform: translateX(-50%); transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-visible.title-underline::after { width: 60px; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Mobil menü overlay gelişmiş blur */
        .vg-overlay { transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.55s; }

        /* Accordion smooth geçiş */
        .accordion-content { transition: grid-template-rows 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease-out, margin-top 0.4s ease; }

        /* Prefers-reduced-motion desteği (erişilebilirlik) */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .reveal-element { opacity: 1; transform: none; }
        }

        /* SCROLL PROGRESS BAR — üstte ince ilerleme çubuğu */
        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, #f39c12, #e67e22);
            z-index: 10002; width: 0%;
            box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
            pointer-events: none;
            transition: width 0.1s linear;
        }

        /* MOUSE CLICK RIPPLE — tıklamada dalga efekti */
        .click-ripple {
            position: fixed; border-radius: 50%;
            background: radial-gradient(circle, rgba(243,156,18,0.4) 0%, rgba(243,156,18,0) 70%);
            transform: translate(-50%, -50%) scale(0);
            animation: clickRipple 0.6s ease-out forwards;
            pointer-events: none; z-index: 99999;
            width: 40px; height: 40px;
        }
        @keyframes clickRipple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
    </style>

        </div>
    </div>

    <div id="toast-message"><i class="fas fa-info-circle mr-2 text-brand-green"></i>İşlem başarılı</div>

    <div id="lightbox-overlay">
        <button id="lightbox-close" aria-label="Kapat" class="btn-press" onclick="window.closeLightbox()"><i class="fas fa-times"></i></button>
        <button id="lightbox-prev" aria-label="Önceki" class="lightbox-btn btn-press" onclick="window.changeLightboxImage(-1)"><i class="fas fa-chevron-left"></i></button>
        
        <div id="lightbox-content-wrapper">
            <i id="lightbox-loader" class="fas fa-circle-notch fa-spin"></i>
            <img id="lightbox-img" src="" alt="Tam Ekran Görsel">
        </div>
        
        <button id="lightbox-next" aria-label="Sonraki" class="lightbox-btn btn-press" onclick="window.changeLightboxImage(1)"><i class="fas fa-chevron-right"></i></button>
        <div id="lightbox-counter" class="lightbox-counter">1 / 1</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker kaydı başarılı:', registration.scope))
                    .catch(error => console.error('ServiceWorker kaydı başarısız:', error));
            });
        }
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
